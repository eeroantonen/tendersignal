[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tendersignal"
version = "0.1.0"
description = "AI-assisted public procurement opportunity copilot MVP using real public tender notices."
requires-python = ">=3.9"
dependencies = [
  "requests>=2.32",
  "urllib3<2",
  "pandas>=2.2",
  "streamlit>=1.50",
  "pydeck>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["openai>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
